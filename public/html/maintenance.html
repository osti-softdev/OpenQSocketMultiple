<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Under Maintenance</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1e3a8a, #0f172a);
      overflow: hidden;
      color: #fff;
    }

    /* animated background blobs */
    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(59, 130, 246, 0.3);
      filter: blur(120px);
      border-radius: 50%;
      animation: float 10s infinite ease-in-out;
    }

    .blob:nth-child(1) {
      top: -100px;
      left: -100px;
    }

    .blob:nth-child(2) {
      bottom: -150px;
      right: -100px;
      background: rgba(168, 85, 247, 0.25);
      animation-delay: 3s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(40px); }
    }

    .container {
      text-align: center;
      z-index: 2;
      max-width: 600px;
      padding: 30px;
    }

    .icon {
      font-size: 70px;
      color: #60a5fa;
      animation: pulse 1.8s infinite;
      margin-bottom: 20px;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.85;
      line-height: 1.6;
    }

    .status-box {
      margin-top: 25px;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      display: inline-block;
      backdrop-filter: blur(10px);
    }

    .spinner {
      margin: 20px auto 0;
      width: 45px;
      height: 45px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #60a5fa;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 20px;
      font-size: 0.85rem;
      opacity: 0.6;
    }

    .icons-row {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 20px;
      opacity: 0.8;
    }

    .icons-row i {
      transition: 0.3s;
    }

    .icons-row i:hover {
      transform: translateY(-5px);
      color: #60a5fa;
    }
  </style>
</head>

<body>

  <div class="blob"></div>
  <div class="blob"></div>

  <div class="container">
    <div class="icon">
      <i class="fas fa-screwdriver-wrench"></i>
    </div>

    <h1>Under Maintenance</h1>
    <p>
      We’re currently improving the system to serve you better.<br>
      Please check back soon.
    </p>

    <div class="status-box">
      System updates in progress
      <div class="spinner"></div>
    </div>

    <div class="icons-row">
      <i class="fas fa-server"></i>
      <i class="fas fa-shield-halved"></i>
      <i class="fas fa-code"></i>
      <i class="fas fa-gear"></i>
    </div>

    <div class="footer">
      © 2026 OpenQ • All rights reserved
    </div>
  </div>

</body>
</html>
