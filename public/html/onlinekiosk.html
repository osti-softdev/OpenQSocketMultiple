<script>
function reloadCSS() {
    let links = document.getElementsByTagName('link');
    for (let i = 0; i < links.length; i++) {
        let link = links[i];
        if (link.rel === 'stylesheet') {
            // Append or update the timestamp to force reload
            let href = link.href.split('?')[0];
            link.href = href + '?t=' + new Date().getTime();
        }
    }
}

// Reload styles every 10 seconds
setInterval(reloadCSS, 10000);
</script>
