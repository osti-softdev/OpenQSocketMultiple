<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SimpleQ</title>
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/admin_login.css">
    <script src="/libs/jquery-3.7.1.js"></script>
    <script src="/libs/sweetalert2@11.js"></script>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="login-header">
                <div class="logo">SimpleQ</div>
                <h1>Admin Portal</h1>
                <p>Please sign in to access the admin dashboard</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-full shadow-lg">Sign In</button>
            </form>
            <div id="login-error" class="error-text"></div>
        </div>
    </div>
</body>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/admin/admin_login.js"></script>
</html>
