<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <title>OpenQ Caller Login</title>
    <link rel="stylesheet" href="/css/caller.css">
    <script src="/libs/jquery-3.7.1.js"></script>
    <script src="/libs/sweetalert2@11.js"></script>
</head>
<body onselectstart="return false">
    <section id="loginSec" class="loginPage">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">SimpleQ</div>
                <h1>Teller Portal</h1>
                <p>Please sign in to your counter</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-full shadow-lg">Sign In</button>
            </form>
            <div id="login-error" class="error-text"></div>
        </div>
    </section>
    <script src="/js/teller/caller_login.js"></script>
</body>
</html>
