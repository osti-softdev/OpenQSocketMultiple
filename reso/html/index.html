<!-- reso/html/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Display Monitor</title>
    
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <script src="/libs/jquery-3.7.1.js"></script>
    <script src="/libs/sweetalert2@11.js"></script>
    <link rel="stylesheet" href="/css/index.css">
</head>

<body onselectstart="return false">
    <div class="main-container">
        <div class="header-container">
            <div class="companyLogo"></div>
        </div>

        <div class="timer">
            <div class="date"></div>
            <div class="time"></div>
        </div>
        <div class="video-container">
            <div class="ad-slot"></div>
        </div>
        <div class="content-container">
          
        <div id="servicesDisplay"></div>
        </div>
        <div class="footer-container" id="marquee_parent">
            <div id="marquee">
                <p id='runner'></p>
            </div>
        </div>

        <!-- Popup -->
        <div id="popup">
            <div id="sub_popup">
            <div id="ticketpop">
            </div>
            <div id="counterpop">
            </div>
            </div>
        </div>
    </div>
    <audio id="audio" autoplay>
        <source src="audio/chime2.mp3" type="audio/mpeg">
    </audio>

    <script src="/socket.io/socket.io.js" async></script>
    <script src="/js/indexSocket.js" async></script>
    <script src="/js/footer.js" async></script>
    <script src="/js/popup.js" async></script>
    <script src="/js/clock.js" async></script>
    <script>

    </script>
</body>
</html>
